<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ciel et pollution lumineuse</title>
<style>
  :root {
    --bg: #04060b;
    --fg: #e6e9f0;
    --muted: #8a93a6;
    --accent: #f2b46d;
    --track: #1c2230;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--bg); color: var(--fg); overflow: hidden;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .tag { position: absolute; top: 14px; left: 16px; font-size: 13px; color: var(--muted); }
  .toggles { position: absolute; top: 10px; right: 12px; display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
  .toggle { font: inherit; font-size: 13px;
    color: var(--muted); background: transparent; border: 1px solid var(--track);
    border-radius: 999px; padding: 5px 12px; cursor: pointer; }
  .toggle[aria-pressed="true"] { color: var(--fg); border-color: #3a4560; }
  .panel { position: absolute; left: 0; right: 0; bottom: 0; padding: 0 16px 18px;
    display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .count { text-align: center; line-height: 1; }
  .count b { font-size: clamp(34px, 7vw, 52px); font-weight: 600; font-variant-numeric: tabular-nums; }
  .count span { display: block; margin-top: 6px; font-size: 14px; color: var(--muted); }
  .slider { width: min(560px, 100%); }
  footer { display: flex; align-items: center; gap: 10px; font-size: 11px; color: var(--muted); line-height: 1.35; }
  footer p { margin: 0; }
  .logo { flex: none; display: block; background: #fff; border-radius: 8px; padding: 3px; opacity: .85; }
  .logo:hover, .logo:focus-visible { opacity: 1; }
  .logo img { display: block; width: 30px; height: auto; }
  .track { position: relative; padding: 24px 0 26px; }
  .mark { position: absolute; transform: translateX(-50%); font: inherit; font-size: 12px; line-height: 1;
    color: var(--muted); background: none; border: 0; cursor: pointer; white-space: nowrap; padding: 3px 2px; }
  .mark.up { top: 0; } .mark.down { bottom: 0; }
  .mark.first { transform: translateX(-11px); } .mark.last { transform: translateX(calc(-100% + 11px)); }
  .mark.on { color: var(--accent); }
  .mark .s { display: none; }
  @media (max-width: 520px) {
    .mark .l { display: none; } .mark .s { display: inline; }
    .tag { top: 46px; }
  }
  .mark::before { content: ""; position: absolute; width: 1px; height: 6px; background: currentColor; opacity: .7; }
  .mark.up::before { top: 100%; left: 50%; } .mark.down::before { bottom: 100%; left: 50%; }
  .mark.first::before { left: 11px; } .mark.last::before { left: auto; right: 11px; }
  input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 28px; background: transparent; cursor: pointer; }
  input[type=range]::-webkit-slider-runnable-track { height: 6px; border-radius: 3px;
    background: linear-gradient(90deg, #0b1020, #3b3550 45%, #a0703f 80%, #e0a060); }
  input[type=range]::-moz-range-track { height: 6px; border-radius: 3px;
    background: linear-gradient(90deg, #0b1020, #3b3550 45%, #a0703f 80%, #e0a060); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 22px; height: 22px; margin-top: -8px;
    border-radius: 50%; background: var(--fg); border: 3px solid var(--bg); box-shadow: 0 0 0 1px #556; }
  input[type=range]::-moz-range-thumb { width: 16px; height: 16px; border-radius: 50%;
    background: var(--fg); border: 3px solid var(--bg); }
</style>
</head>
<body>
<canvas id="sky"></canvas>
<div class="tag" id="tag"></div>
<div class="toggles">
  <button class="toggle" id="lines" aria-pressed="false">Constellations</button>
</div>
<div class="panel">
  <div class="count"><b id="n">–</b><span>étoiles visibles à l'œil nu</span></div>
  <div class="slider">
    <div class="track" id="track">
      <input id="s" type="range" min="0" max="1000" aria-label="Luminance du ciel">
    </div>
  </div>

const LAT = 50.29, LON = 2.78, D2R = Math.PI / 180;
const when = new Date(); when.setHours(22, 0, 0, 0);
const jd = when.getTime() / 86400000 + 2440587.5;
const LST = ((280.46061837 + 360.98564736629 * (jd - 2451545) + LON) % 360 + 360) % 360;
const sinP = Math.sin(LAT * D2R), cosP = Math.cos(LAT * D2R);
const dateTxt = when.toLocaleDateString('fr-FR', { day: 'numeric', month: 'long' }) + ', 22 h';

// Équatorial -> horizontal ; renvoie [sin(alt), az en rad]
function toHoriz(ra, dec) {
  const H = (LST - ra) * D2R, d = dec * D2R;
  const e = -Math.cos(d) * Math.sin(H), m = Math.cos(d) * Math.cos(H), z = Math.sin(d);
  const n = -m * sinP + z * cosP, u = m * cosP + z * sinP;
  return [u, Math.atan2(e, n)];
}

const K_EXT = 0.25;
// Éclaircissement du ciel vers l'horizon (dôme lumineux), croissant avec la pollution
const domeAmp = s => 0.35 + 1.5 * Math.min(1, Math.max(0, (22 - s) / 5));
// Classe de Bortle d'après la légende SQM de lightpollutionmap.info (atlas Falchi 2016) ;
// concorde avec les classes relevées dans l'atlas pour les onze points vérifiés.
const bortle = s => s > 21.99 ? '1' : s > 21.89 ? '2' : s > 21.69 ? '3' : s > 20.49 ? '4' :
  s > 19.50 ? '5' : s > 18.94 ? '6' : s > 18.38 ? '7' : '8-9';
const sqmToCd = s => 1.08e5 * Math.pow(10, -0.4 * s);
const cdToSqm = L => -2.5 * Math.log10(L / 1.08e5);
// Éblouissement par les éclairages proches (formule de Stiles-Holladay, CIE) :
// luminance de voile L = 10 · E / θ²  (cd/m², E en lux à l'œil, θ en degrés).
// Hypothèse non mesurée : 3 lx à l'œil, source à 40° du regard.
const L_VEIL = 10 * 3 / (40 * 40);
// Nul en campagne (21,22 et plus), complet en ville (19,36 et moins), progressif entre les deux.
const glareWeight = s => Math.min(1, Math.max(0, (21.22 - s) / (21.22 - 19.36)));
const withGlare = s => cdToSqm(sqmToCd(s) + glareWeight(s) * L_VEIL);

// --- Carte de la Voie lactée (isophotes d3-celestial) rasterisée en équirectangulaire
const MW_W = 720, MW_H = 360;
const mwMap = (() => {
  const c = document.createElement('canvas'); c.width = MW_W; c.height = MW_H;
  const g = c.getContext('2d');
  g.setTransform(MW_W / 360, 0, 0, -MW_H / 180, 0, MW_H / 2);
  g.globalCompositeOperation = 'lighter';
  g.fillStyle = 'rgba(255,255,255,0.2)';
  // toutes les copies décalées de 360° dans un même tracé, pour que l'évitement (evenodd)
  // entre le bord nord et le bord sud de la bande soit cohérent
  for (const level of DATA.mw) for (const poly of level) {
    g.beginPath();
    for (let k = -2; k <= 2; k++) for (const r of poly) {
      g.moveTo(r[0] + k * 360, r[1]);
      for (let i = 2; i < r.length; i += 2) g.lineTo(r[i] + k * 360, r[i + 1]);
      const dl = r[r.length - 2] - r[0];
      if (Math.abs(dl) > 180) { // anneau qui fait le tour du ciel : fermer par le pôle
        g.lineTo(r[r.length - 2] + k * 360, 90); g.lineTo(r[0] + k * 360, 90);
      }
      g.closePath();
    }
    g.fill('evenodd');
  }
  const px = g.getImageData(0, 0, MW_W, MW_H).data;
  let a = new Float32Array(MW_W * MW_H), b = new Float32Array(MW_W * MW_H);
  for (let i = 0; i < a.length; i++) a[i] = px[i * 4] / 255;
  // flou gaussien approché : 3 passes de flou en boîte séparables
  const R = 3;
  for (let pass = 0; pass < 3; pass++) {
    for (let y = 0; y < MW_H; y++) for (let x = 0; x < MW_W; x++) {
      let s = 0; for (let k = -R; k <= R; k++) s += a[y * MW_W + (x + k + MW_W) % MW_W];
      b[y * MW_W + x] = s / (2 * R + 1);
    }
    for (let y = 0; y < MW_H; y++) for (let x = 0; x < MW_W; x++) {
      let s = 0; for (let k = -R; k <= R; k++) s += b[Math.min(MW_H - 1, Math.max(0, y + k)) * MW_W + x];
      a[y * MW_W + x] = s / (2 * R + 1);
    }
  }
  return a;
})();
const mwAt = (ra, dec) => {
  const x = Math.floor(((ra % 360 + 360) % 360) / 360 * MW_W) % MW_W;
  const y = Math.min(MW_H - 1, Math.max(0, Math.floor((90 - dec) / 180 * MW_H)));
  return mwMap[y * MW_W + x];
};

// --- Étoiles
const S = DATA.stars, NS = S.length / 4;
const sSin = new Float32Array(NS), sAz = new Float32Array(NS), sExt = new Float32Array(NS),
      sDome = new Float32Array(NS);
const sCol = [];
function bvColor(bv) {
  const T = [[-0.3, 155, 176, 255], [0, 202, 215, 255], [0.3, 248, 247, 255], [0.6, 255, 244, 234],
             [0.9, 255, 228, 196], [1.2, 255, 210, 161], [1.6, 255, 185, 125]];
  bv = Math.min(1.6, Math.max(-0.3, bv));
  let i = 0; while (i < T.length - 2 && bv > T[i + 1][0]) i++;
  const f = (bv - T[i][0]) / (T[i + 1][0] - T[i][0]);
  // désaturé de moitié : l'œil perçoit peu les couleurs la nuit
  return [1, 2, 3].map(k => Math.round(((T[i][k] + f * (T[i + 1][k] - T[i][k])) + 255) / 2));
}
for (let i = 0; i < NS; i++) {
  const [sa, az] = toHoriz(S[i * 4], S[i * 4 + 1]);
  sSin[i] = sa; sAz[i] = az;
  sExt[i] = sa > 0 ? K_EXT * (airmass(sa) - 1) : 99;
  sDome[i] = Math.pow(1 - Math.max(0, sa), 2.2);
  sCol.push(bvColor(S[i * 4 + 3]));
}

// --- Rendu
const cv = document.getElementById('sky'), ctx = cv.getContext('2d');
const off = document.createElement('canvas'), octx = off.getContext('2d');
let W, H, dpr, cx, cy, R, N, pix, img, linesOn = false;
let pSin, pDome, pMW, pIn;

function project(sa, az) {
  const z = Math.PI / 2 - Math.asin(Math.max(-1, Math.min(1, sa)));
  const r = R * Math.tan(z / 2);
  return [cx - r * Math.sin(az), cy - r * Math.cos(az)];
}

function layout() {
  dpr = Math.min(2, window.devicePixelRatio || 1);
  W = innerWidth; H = innerHeight;
  cv.width = W * dpr; cv.height = H * dpr;
  const panelH = 270, top = 46;
  R = Math.max(80, Math.min(W - 32, H - panelH - top - 16) / 2);
  cx = W / 2; cy = top + (H - panelH - top) / 2;
  // grille du fond de ciel, en sous-résolution
  N = Math.min(720, Math.round(R * dpr));
  off.width = off.height = N;
  img = octx.createImageData(N, N); pix = img.data;
  pSin = new Float32Array(N * N); pDome = new Float32Array(N * N);
  pMW = new Float32Array(N * N); pIn = new Uint8Array(N * N);
  for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) {
    const dx = (i + 0.5) / N * 2 - 1, dy = (j + 0.5) / N * 2 - 1, rho = Math.hypot(dx, dy);
    const k = j * N + i;
    if (rho > 1.01) continue;
    pIn[k] = 1;
    const alt = Math.PI / 2 - 2 * Math.atan(rho), az = Math.atan2(-dx, -dy);
    const ca = Math.cos(alt), sa = Math.sin(alt);
    const e = ca * Math.sin(az), n = ca * Math.cos(az);
    const zq = n * cosP + sa * sinP, m = -n * sinP + sa * cosP;
    const dec = Math.asin(zq) / D2R, ra = LST - Math.atan2(-e, m) / D2R;
    const sa0 = Math.max(0.02, sa);
    pSin[k] = sa0;
    pDome[k] = Math.pow(1 - sa0, 2.2);
    // excès de brillance de la Voie lactée (en unités du fond de ciel naturel), éteint par l'atmosphère
    const L = mwAt(ra, dec) * 5;
    pMW[k] = 0.25 * Math.pow(L, 1.43) * Math.pow(10, -0.4 * K_EXT * (airmass(sa0) - 1));
  }
  render();
}

const MW_C0 = 0.35, MW_CMAX = 2.5;
function render() {
  const sSky = fromSlider(+slider.value);  // luminance du ciel (atlas)
  const here = marks.find(m => Math.abs(sSky - m.sqm) < 0.01);
  const s = withGlare(sSky), amp = domeAmp(sSky);   // luminance perçue (ciel + éblouissement)
  // 1. Fond de ciel + Voie lactée, pixel par pixel
  for (let k = 0, p = 0; k < N * N; k++, p += 4) {
    if (!pIn[k]) { pix[p + 3] = 0; continue; }
    const sl = s - amp * pDome[k];
    const t = Math.min(1, Math.max(0, (21.95 - sl) / 6));
    const tt = Math.pow(t, 1.15);
    // contraste Voie lactée / ciel, puis seuil de perception
    const c = pMW[k] * Math.exp(-0.921 * (22 - sl));
    // Seuils calés sur les descriptions de l'échelle de Bortle (2001) :
    // structure riche en classe 3, seules les parties brillantes en classe 4,
    // délavée en classe 5, quasi invisible au-delà.
    const v = c > MW_C0 ? Math.pow(Math.min(1, (c - MW_C0) / (MW_CMAX - MW_C0)), 0.8) * 0.38 : 0;
    pix[p]     = 4 + 128 * tt + 175 * v;
    pix[p + 1] = 6 + 100 * tt + 180 * v;
    pix[p + 2] = 14 + 74 * tt + 198 * v;
    pix[p + 3] = 255;
  }
  octx.putImageData(img, 0, 0);

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);
  ctx.save();
  ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2); ctx.clip();
  ctx.imageSmoothingEnabled = true;
  ctx.drawImage(off, cx - R, cy - R, 2 * R, 2 * R);

  // 2. Constellations
  if (linesOn) {
    ctx.strokeStyle = 'rgba(120,150,210,0.35)'; ctx.lineWidth = 1;
    ctx.beginPath();
    for (const l of DATA.lines) {
      let prev = null;
      for (let i = 0; i < l.length; i += 2) {
        const [sa, az] = toHoriz(l[i], l[i + 1]);
        const q = sa > -0.1 ? project(sa, az) : null;
        if (q && prev) { ctx.moveTo(prev[0], prev[1]); ctx.lineTo(q[0], q[1]); }
        prev = q;
      }
    }
    ctx.stroke();
  }

  // 3. Étoiles
  const scale = Math.max(0.7, Math.min(1.6, R / 380));
  let count = 0;
  for (let i = 0; i < NS; i++) {
    if (sSin[i] <= 0) continue;
    const V = S[i * 4 + 2];
    const d = nelm(s - amp * sDome[i]) - (V + sExt[i]);
    if (d <= 0) continue;
    count++;
    const a = Math.min(1, 0.12 + d * 0.42);
    const r = (0.45 + Math.max(0, 5.6 - V) * 0.36) * (0.65 + 0.35 * Math.min(1, d / 3)) * scale;
    const [x, y] = project(sSin[i], sAz[i]);
    const [cr, cg, cb] = sCol[i];
    if (V < 1.6 && d > 1.5) { // halo des étoiles brillantes
      const g = ctx.createRadialGradient(x, y, 0, x, y, r * 4);
      g.addColorStop(0, `rgba(${cr},${cg},${cb},${0.35 * a})`);
      g.addColorStop(1, `rgba(${cr},${cg},${cb},0)`);
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r * 4, 0, Math.PI * 2); ctx.fill();
    }
    ctx.fillStyle = `rgba(${cr},${cg},${cb},${a})`;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();

  // 4. Horizon et points cardinaux
  ctx.strokeStyle = '#2a3245'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2); ctx.stroke();
  ctx.fillStyle = '#8a93a6'; ctx.font = '12px system-ui, sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  [['N', 0, -1], ['S', 0, 1], ['E', -1, 0], ['O', 1, 0]].forEach(([t, dx, dy]) =>
    ctx.fillText(t, cx + dx * (R + 11), cy + dy * (R + 11)));

  // Valeurs de l'atlas : 2 décimales sur un repère, 1 entre deux ; Bortle seulement sur les repères
  document.getElementById('read').textContent = here
    ? here.sqm.toLocaleString('fr-FR', { minimumFractionDigits: 2 }) + ' mag/arcsec² · Bortle ' + here.bortle
    : sSky.toLocaleString('fr-FR', { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + ' mag/arcsec² · Bortle ' + bortle(sSky);
  document.getElementById('n').textContent = count.toLocaleString('fr-FR');
  marks.forEach(m => m.el.classList.toggle('on', m === here));
  document.getElementById('tag').textContent = (here ? here.name : 'Ciel d\'Arras') + ' · ' + dateTxt;
}

const slider = document.getElementById('s');
// Repères : luminance zénithale de l'atlas mondial 2015 (Falchi et al. 2016),
// relevée sur lightpollutionmap.info. 22,0 = ciel naturel de référence de l'atlas.
const marks = [
  { name: 'Causse Méjean, réserve de ciel étoilé des Cévennes', label: 'Causse Méjean (Cévennes)', tiny: 'Cévennes', sqm: 21.82, bortle: '3', row: 'down' },
  { name: 'Campagne près d\'Avesnes-le-Comte', label: 'Campagne (Avesnes-le-Comte)', tiny: 'Campagne', sqm: 21.22, bortle: '4', row: 'up' },
  { name: 'Dainville', label: 'Dainville', tiny: 'Dainville', sqm: 19.36, bortle: '6', row: 'down' },
  { name: 'Grand-Place d\'Arras', label: 'Grand-Place d\'Arras', tiny: 'Grand-Place', sqm: 18.81, bortle: '7', row: 'up' },
  { name: 'Lille, centre', label: 'Lille', tiny: 'Lille', sqm: 18.25, bortle: '8-9', row: 'down' },
  { name: 'Paris, Châtelet', label: 'Paris', tiny: 'Paris', sqm: 17.59, bortle: '8-9', row: 'up' },
];
const S_MAX = 22.0, S_MIN = 17.59;
const toSlider = s => Math.round((S_MAX - s) / (S_MAX - S_MIN) * 1000);
const fromSlider = v => S_MAX - v / 1000 * (S_MAX - S_MIN);
const track = document.getElementById('track');
marks.forEach((m, i) => {
  const b = document.createElement('button');
  b.className = 'mark ' + m.row + (i === 0 ? ' first' : i === marks.length - 1 ? ' last' : '');
  b.innerHTML = '<span class="l"></span><span class="s"></span>';
  b.children[0].textContent = m.label; b.children[1].textContent = m.tiny;
  b.setAttribute('aria-label', m.name);
  b.addEventListener('click', () => { slider.value = toSlider(m.sqm); render(); });
  track.appendChild(b); m.el = b;
});
function placeMark() {
  const w = slider.offsetWidth, th = 11;
  marks.forEach(m => m.el.style.left = (th + toSlider(m.sqm) / 1000 * (w - 2 * th)) + 'px');
}
// un relâchement près d'un repère s'y aimante
slider.addEventListener('change', () => {
  const m = marks.find(m => Math.abs(+slider.value - toSlider(m.sqm)) <= 12);
  if (m) { slider.value = toSlider(m.sqm); render(); }
});
slider.value = toSlider(18.81);
let queued = false;
slider.addEventListener('input', () => {
  if (queued) return; queued = true;
  requestAnimationFrame(() => { queued = false; render(); });
});
document.getElementById('lines').addEventListener('click', e => {
  linesOn = !linesOn; e.currentTarget.setAttribute('aria-pressed', linesOn); render();
});
let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { layout(); placeMark(); }, 120); });
layout(); placeMark();
</script>
</body>
</html>
