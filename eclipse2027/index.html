/* ═══════════════════════════════════════════════════════════════
   INTERPOLATION DE LA TRAJECTOIRE
   ═══════════════════════════════════════════════════════════════ */
function interp(arr, m) {
  if (m <= 0) return arr[0];
  if (m >= NMIN) return arr[NMIN];
  const i = Math.floor(m), f = m - i;
  return arr[i] + f * (arr[i+1] - arr[i]);
}

function moonOffset(city, t) {
  return { ux: interp(city.X, t), uy: interp(city.Y, t) };
}

/* Aire d'intersection de deux disques (rayons 1 et k, distance d) */
function overlap(d, k) {
  if (d >= 1+k) return 0;
  if (d + k <= 1) return Math.PI*k*k;
  if (d + 1 <= k) return Math.PI;
  const cA = Math.max(-1, Math.min(1, (d*d + 1 - k*k)/(2*d)));
  const cB = Math.max(-1, Math.min(1, (d*d + k*k - 1)/(2*d*k)));
  const a = Math.acos(cA), b = Math.acos(cB);
  return a + k*k*b - 0.5*(Math.sin(2*a) + k*k*Math.sin(2*b));
}
function obs(d, k) { return overlap(d, k) / Math.PI; }

/* ═══════════════════════════════════════════════════════════════
   DESSIN
   ═══════════════════════════════════════════════════════════════ */
function drawPanel(ctx, city, t, W, H, phaseEl) {
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle = '#000';
  ctx.fillRect(0,0,W,H);

  const sunR = Math.min(W,H) * 0.26;
  const monR = sunR * city.k;
  const cx = W/2, cy = H/2;

  const { ux, uy } = moonOffset(city, t);
  const mx = cx + ux*sunR;
  const my = cy - uy*sunR;          // y écran vers le bas, y ciel vers le zénith

  const dN = Math.hypot(ux, uy);
  const inEclipse = t >= city.C1 && t <= city.C4;
  const curObs = inEclipse ? obs(dN, city.k) : 0;
  const inTotality = city.isTotal && t >= city.C2 && t <= city.C3;

  if (inTotality) {
    phaseEl.textContent = 'Totalité';
  } else if (curObs > 0.005) {
    phaseEl.textContent = Math.round(curObs*100) + ' %';
  } else {
    phaseEl.textContent = '';
  }

  /* ── Couronne solaire (Louxor, totalité) ── */
  if (inTotality) {
    const g = ctx.createRadialGradient(cx,cy, sunR*0.88, cx,cy, sunR*3.2);
    g.addColorStop(0,    'rgba(255,248,210,0.90)');
    g.addColorStop(0.08, 'rgba(255,230,165,0.72)');
    g.addColorStop(0.28, 'rgba(255,200, 90,0.38)');
    g.addColorStop(0.55, 'rgba(255,160, 50,0.12)');
    g.addColorStop(1,    'rgba(255,120, 20,0)');
    ctx.save();
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(cx,cy,sunR*3.2,0,Math.PI*2); ctx.fill();
    ctx.restore();
    ctx.save();
    ctx.globalAlpha = 0.22;
    for (let i=0; i<16; i++) {
      const a  = (i/16)*Math.PI*2 + 0.18;
      const r1 = sunR*1.04;
      const r2 = sunR*(1.6+(i%5)*0.28);
      const gs = ctx.createLinearGradient(cx+Math.cos(a)*r1,cy+Math.sin(a)*r1,
                                           cx+Math.cos(a)*r2,cy+Math.sin(a)*r2);
      gs.addColorStop(0,'rgba(255,240,190,0.9)');
      gs.addColorStop(1,'rgba(255,200,80,0)');
      ctx.strokeStyle = gs; ctx.lineWidth = sunR*0.05;
      ctx.beginPath();
      ctx.moveTo(cx+Math.cos(a)*r1, cy+Math.sin(a)*r1);
      ctx.lineTo(cx+Math.cos(a)*r2, cy+Math.sin(a)*r2);
      ctx.stroke();
    }
    ctx.restore();
  }

  /* ── Lueur solaire (hors totalité) ── */
  if (!inTotality) {
    const gs = ctx.createRadialGradient(cx,cy,sunR*0.78,cx,cy,sunR*1.65);
    gs.addColorStop(0,'rgba(253,184,19,0.11)');
    gs.addColorStop(1,'rgba(253,150,10,0)');
    ctx.fillStyle = gs;
    ctx.beginPath(); ctx.arc(cx,cy,sunR*1.65,0,Math.PI*2); ctx.fill();
  }

  /* ── Disque solaire ── */
  ctx.save();
  ctx.beginPath(); ctx.arc(cx,cy,sunR,0,Math.PI*2);
  ctx.fillStyle = '#FDB813'; ctx.fill();
  ctx.restore();

  /* ── Disque lunaire ── */
  if (dN < 1 + city.k + 0.35) {
    ctx.save();
    ctx.beginPath(); ctx.arc(mx,my,monR,0,Math.PI*2);
    ctx.fillStyle = '#06060b'; ctx.fill();
    ctx.strokeStyle = 'rgba(50,50,70,0.28)'; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.restore();
  }

  /* ── Repère du zénith, ancré en haut du panneau ──
     Il était auparavant positionné à 3,5 rayons solaires au-dessus du
     centre, ce qui le rejetait hors du canevas dans presque toutes les
     proportions de fenêtre. Il est maintenant calé sur le haut du
     panneau, sous les libellés HTML de la ville. */
  const topY = Math.max(60, H*0.085);
  ctx.save();
  ctx.fillStyle = 'rgba(255,255,255,0.24)';
  ctx.font = '9px Helvetica, Arial, sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  ctx.fillText('ZÉNITH', cx, topY);
  ctx.strokeStyle = 'rgba(255,255,255,0.12)';
  ctx.lineWidth = 1; ctx.setLineDash([3,4]);
  ctx.beginPath(); ctx.moveTo(cx, topY+5); ctx.lineTo(cx, topY+15); ctx.stroke();
  ctx.setLineDash([]);
  ctx.restore();

  /* ── Silhouette du lieu, sous le mot ZÉNITH ── */
  /* Pendant la totalité la couronne solaire monte jusqu'à trois rayons
     solaires et vient mordre le filigrane. On l'efface donc entièrement
     entre C2 et C3, avec un fondu d'une minute et douze secondes de part
     et d'autre pour éviter une disparition brutale. */
  let lmVis = 1;
  if (city.isTotal) {
    const FADE = 1.2;                       // minutes
    if (t >= city.C2 && t <= city.C3)      lmVis = 0;
    else if (t > city.C2 - FADE && t < city.C2) lmVis = (city.C2 - t) / FADE;
    else if (t > city.C3 && t < city.C3 + FADE) lmVis = (t - city.C3) / FADE;
  }
  drawLandmark(ctx, city, W, cx, topY+20, cy - sunR - 6, 1 - curObs, lmVis);
}

/* ═══════════════════════════════════════════════════════════════
   SILHOUETTES DE LIEU
   Tracé vectoriel pur, un seul Path2D par monument rempli en une
   fois pour éviter les surbrillances aux recouvrements, puis
   quelques ouvertures repeintes en noir pour suggérer le détail.

   La clarté du filigrane suit le flux solaire restant, soit
   1 moins l'obscuration : à Arras la silhouette s'assombrit à
   peine, à Louxor elle bascule dans le bleu nuit pendant la
   totalité puis revient. Réglage dans landmarkStyle.
   ═══════════════════════════════════════════════════════════════ */

const LM_ALPHA_MIN = 0.10;   // filigrane pendant la totalité
const LM_ALPHA_MAX = 0.30;   // filigrane en plein Soleil

/* La clarté suit la racine du flux plutôt que le flux lui-même, ce qui
   se rapproche de la réponse de l'œil : à 46 pour cent d'occultation la
   silhouette d'Arras ne perd presque rien, alors qu'à Louxor la chute
   des dernières secondes reste franche. Passer à un profil linéaire
   suffit à rendre l'effet plus démonstratif mais moins fidèle. */
function landmarkStyle(flux, vis) {
  const f = Math.max(0, Math.min(1, flux));
  const r_ = Math.sqrt(f);
  const warm = [222, 214, 198], cool = [96, 116, 160];
  const r = Math.round(warm[0]*r_ + cool[0]*(1-r_));
  const g = Math.round(warm[1]*r_ + cool[1]*(1-r_));
  const b = Math.round(warm[2]*r_ + cool[2]*(1-r_));
  const a = (LM_ALPHA_MIN + (LM_ALPHA_MAX - LM_ALPHA_MIN) * r_) * vis;
  return 'rgba(' + r + ',' + g + ',' + b + ',' + a.toFixed(3) + ')';
}

/* Beffroi d'Arras et façade de l'hôtel de ville
   Boîte de référence 300 x 240, origine en haut à gauche. Silhouette

   étage de l'horloge, fût, toiture à lucarnes et arcade au sol. */
function pathBeffroi() {
  const p = new Path2D();
  p.arc(117, 16, 4.5, 0, Math.PI*2);                                   // lion
  p.moveTo(117, 20); p.lineTo(123, 34); p.lineTo(111, 34); p.closePath(); // flèche
  p.rect(111.5, 32, 11, 13);                                           // lanternon
  p.moveTo(109,45); p.lineTo(125,45); p.lineTo(131,52); p.lineTo(133,61);
  p.lineTo(128,70); p.lineTo(122,77); p.lineTo(112,77); p.lineTo(106,70);
  p.lineTo(101,61); p.lineTo(103,52); p.closePath();                   // couronne renflée
  p.rect(95, 75, 44, 9);                                               // galerie
  p.rect(101, 82, 32, 32);                                             // étage des baies
  p.rect(97, 112, 40, 9);                                              // corniche
  p.rect(100, 119, 34, 32);                                            // étage de l'horloge
  p.rect(103, 149, 28, 32);                                            // fût
  for (let i = 0; i < 9; i++) {                                        // lucarnes à épis
    const x = 44 + i*25;
    p.rect(x, 144, 9, 14);
    p.moveTo(x+4.5, 137); p.lineTo(x+9, 144); p.lineTo(x, 144); p.closePath();
  }
  p.moveTo(24,178); p.lineTo(276,178); p.lineTo(262,156); p.lineTo(38,156); p.closePath(); // toiture
  p.rect(30, 178, 240, 62);                                            // façade
  return p;
}
function pathBeffroiVoids() {
  const p = new Path2D();
  p.arc(117, 135, 7, 0, Math.PI*2);          // cadran de l'horloge
  p.rect(105, 90, 7, 20); p.rect(120, 90, 7, 20);   // baies jumelées
  const xs = [44, 76, 108, 140, 172, 204, 236];
  for (const x of xs) {
    p.rect(x, 214, 18, 26);                  // arcade
    p.rect(x+2, 186, 14, 22);                // fenêtres

}

const LANDMARKS = {
  Arras:  { path: pathBeffroi(), voids: pathBeffroiVoids(), w: 300, h: 240 },
  Louxor: { path: pathLouxor(),  voids: pathLouxorVoids(),  w: 200, h: 130 }
};

function drawLandmark(ctx, city, W, cx, yTop, yLimit, flux, vis) {
  if (vis <= 0.01) return;                       // totalité : silhouette effacée
  const lm = LANDMARKS[city.name];
  if (!lm) return;
  const hAvail = Math.min(yLimit - yTop, 88);
  if (hAvail < 26) return;                       // panneau trop bas, on renonce
  const s = Math.min(hAvail / lm.h, (W*0.5) / lm.w);

  ctx.save();
  ctx.translate(cx - lm.w*s/2, yTop);
  ctx.scale(s, s);
  ctx.fillStyle = landmarkStyle(flux, vis);
  ctx.fill(lm.path);
  ctx.fillStyle = '#000';
  ctx.fill(lm.voids);
  ctx.restore();
}

/* ═══════════════════════════════════════════════════════════════
   FORMAT HEURE
   ═══════════════════════════════════════════════════════════════ */
function fmt(m, tzOffset) {
  const ts = (8 + tzOffset)*3600 + m*60;
  const h  = Math.floor(ts/3600) % 24;
  const mn = Math.floor((ts%3600)/60);
  return String(h).padStart(2,'0') + ':' + String(mn).padStart(2,'0');
}

/* Même chose avec les secondes, pour les repères d'événement */
function fmtS(m, tzOffset) {
  const ts = Math.round((8 + tzOffset)*3600 + m*60);
  const h  = Math.floor(ts/3600) % 24;
  const mn = Math.floor((ts%3600)/60);
  const sc = ts % 60;
  return String(h).padStart(2,'0') + ':' + String(mn).padStart(2,'0')
       + ':' + String(sc).padStart(2,'0');
}

   ═══════════════════════════════════════════════════════════════ */
const evA = document.getElementById('eventArras');
const evL = document.getElementById('eventLouxor');

function setEvent(el, html) {
  if (html) { el.innerHTML = html; el.classList.add('on'); }
  else { el.innerHTML = ''; el.classList.remove('on'); }
}

function updateEvents(t) {
  if (t >= A.MAX) {
    setEvent(evA, '<span class="tag">Maximum</span> &nbsp;' + fmtS(A.MAX, A.tz) + ' &nbsp;&middot;&nbsp; 46 %');
  } else {
    setEvent(evA, '');
  }

  if (t >= L.C3) {
    setEvent(evL, '<span class="tag">Totalité</span> &nbsp;' + fmtS(L.C2, L.tz)
                + ' &rarr; ' + fmtS(L.C3, L.tz));
  } else if (t >= L.C2) {
    setEvent(evL, '<span class="tag">Totalité</span> &nbsp;début ' + fmtS(L.C2, L.tz));
  } else {
    setEvent(evL, '');
  }
}

/* ═══════════════════════════════════════════════════════════════
   BOUCLE
   ═══════════════════════════════════════════════════════════════ */
let currentMin = 0;

function render(t) {
  currentMin = t;
  drawPanel(ctxA, A, t, cA.width, cA.height, document.getElementById('phaseArras'));
  drawPanel(ctxL, L, t, cL.width, cL.height, document.getElementById('phaseLouxor'));
  document.getElementById('timeArras').textContent  = fmt(t, A.tz);
  document.getElementById('timeLouxor').textContent = fmt(t, L.tz);
  updateEvents(t);
}

const slider = document.getElementById('slider');
slider.addEventListener('input', () => render(parseFloat(slider.value)));

let playing=false, animId=null, lastTs=null;
const SPEED = 1/0.26; // 1 minute réelle = 0.26 s

function togglePlay() {
  const btn = document.getElementById('playBtn');
  if (playing) {
    playing=false; cancelAnimationFrame(animId);
    btn.innerHTML='&#9654; Lancer'; lastTs=null; return;
  }
  if (currentMin >= NMIN) { currentMin=0; slider.value=0; }
  playing=true; btn.innerHTML='&#9646;&#9646; Pause';
  function step(ts) {
    if (!playing) return;
    if (lastTs !== null) {
      const dt = Math.min((ts-lastTs)/1000, 0.08);
      currentMin = Math.min(currentMin + dt*SPEED, NMIN);
      slider.value = currentMin;
      render(currentMin);
      if (currentMin >= NMIN) {
        playing=false; btn.innerHTML='&#9654; Lancer'; lastTs=null; return;
      }
    }
    lastTs=ts; animId=requestAnimationFrame(step);
  }
  animId=requestAnimationFrame(step);
}

window.addEventListener('resize', resize);
resize();
render(0);
</script>

<script>
/* ═══════════════════════════════════════════════════════════════
   HAUTEUR DU SOLEIL SUR L'HORIZON
   Même axe des temps (minutes depuis 08:00 UTC). Le contraste est
   l'objet même de la comparaison : à Arras le Soleil est à 43°
   au maximum, à Louxor il est à 82°, presque au zénith.
   ═══════════════════════════════════════════════════════════════ */
const COL_A = '#ffc830';
const COL_L = '#6cc5ff';

const altCanvas = document.getElementById('altCanvas');
const altCtx = altCanvas.getContext('2d');

function altAt(arr, m) {
  if (m <= 0) return arr[0];
  if (m >= NMIN) return arr[NMIN];
  const i = Math.floor(m), f = m - i;
  return arr[i] + f * (arr[i+1] - arr[i]);
}

function sizeAlt() {
  altCanvas.width = document.getElementById('altWrap').clientWidth;
  altCanvas.height = 118;
}

function fmtUTC(m) {
  const ts = 8*3600 + m*60;
  const h = Math.floor(ts/3600) % 24;
  const mn = Math.floor((ts%3600)/60);
  return String(h).padStart(2,'0') + ':' + String(mn).padStart(2,'0');
}

function drawAltitude(t) {
  const X = altCtx, W = altCanvas.width, H = altCanvas.height;
  if (!W) return;
  X.clearRect(0,0,W,H);

  const ml = 10, mr = 10, mtop = 24, mbot = 16;
  const pw = W - ml - mr, ph = H - mtop - mbot;
  const aMin = 0, aMax = 90;
  const px = m => ml + (m/NMIN) * pw;
  const py = a => mtop + (aMax - a) / (aMax - aMin) * ph;

  X.strokeStyle = 'rgba(255,255,255,0.06)'; X.lineWidth = 1;
  X.fillStyle = '#666';
  X.font = '9px Helvetica, Arial, sans-serif';
  X.textBaseline = 'middle'; X.textAlign = 'left';
  [30,60].forEach(a => {
    const y = py(a);
    X.beginPath(); X.moveTo(ml, y); X.lineTo(ml + pw, y); X.stroke();
    X.fillText(a + '°', ml + 3, y - 6);
  });

  // Zénith
  X.strokeStyle = 'rgba(120,180,255,0.30)'; X.setLineDash([4,4]);
  X.beginPath(); X.moveTo(ml, py(90)); X.lineTo(ml + pw, py(90)); X.stroke();
  X.setLineDash([]);
  X.fillStyle = 'rgba(140,190,255,0.7)'; X.textBaseline = 'top';
  X.fillText('Zénith 90°', ml + 3, py(90) + 2);

  X.textBaseline = 'top'; X.fillStyle = '#5c5c5c';
  [0,30,60,90,120,150,180,210].forEach(m => {
    const x = px(m);
    X.strokeStyle = 'rgba(255,255,255,0.05)';
    X.beginPath(); X.moveTo(x, mtop); X.lineTo(x, mtop + ph); X.stroke();
    X.textAlign = m === 0 ? 'left' : (m === 210 ? 'right' : 'center');
    X.fillText(fmtUTC(m), x, mtop + ph + 4);
  });

  function curve(arr, color) {
    X.strokeStyle = color; X.lineWidth = 2; X.beginPath();
    for (let m = 0; m <= NMIN; m++) {
      const x = px(m), y = py(altAt(arr, m));
      m === 0 ? X.moveTo(x, y) : X.lineTo(x, y);
    }
    X.stroke();
  }
  curve(ALT_LOUXOR, COL_L);
  curve(ALT_ARRAS, COL_A);

  // Maximum de chaque ville
  function maxDot(m, arr, color) {
    const x = px(m), y = py(altAt(arr, m));
    X.fillStyle = '#0c0c0c'; X.beginPath(); X.arc(x, y, 4, 0, 7); X.fill();
    X.strokeStyle = color; X.lineWidth = 1.6; X.beginPath(); X.arc(x, y, 4, 0, 7); X.stroke();
  }
  maxDot(125.30, ALT_LOUXOR, COL_L);
  maxDot(62.25, ALT_ARRAS, COL_A);

  const tc = Math.max(0, Math.min(t, NMIN));
  const xm = px(tc);
  X.strokeStyle = 'rgba(255,255,255,0.45)'; X.lineWidth = 1;
  X.beginPath(); X.moveTo(xm, mtop - 3); X.lineTo(xm, mtop + ph); X.stroke();
  const aA = altAt(ALT_ARRAS, tc), aL = altAt(ALT_LOUXOR, tc);
  X.fillStyle = COL_L; X.beginPath(); X.arc(xm, py(aL), 3.3, 0, 7); X.fill();
  X.fillStyle = COL_A; X.beginPath(); X.arc(xm, py(aA), 3.3, 0, 7); X.fill();

  X.textBaseline = 'alphabetic';
  X.textAlign = 'left'; X.fillStyle = '#888';
  X.font = '600 10px Helvetica, Arial, sans-serif';
  X.fillText("HAUTEUR DU SOLEIL SUR L'HORIZON", ml, 14);

  X.textAlign = 'right';
  X.font = '600 11px Helvetica, Arial, sans-serif';
  const lTxt = 'Louxor ' + aL.toFixed(1) + '°';
  X.fillStyle = COL_L; X.fillText(lTxt, W - mr, 14);
  const lw = X.measureText(lTxt).width;
  X.fillStyle = COL_A; X.fillText('Arras ' + aA.toFixed(1) + '°', W - mr - lw - 16, 14);
  X.textAlign = 'left';
}

let _lastAltMin = NaN;
function altLoop() {
  if (currentMin !== _lastAltMin) {
    drawAltitude(currentMin);
    _lastAltMin = currentMin;
  }
  requestAnimationFrame(altLoop);
}

window.addEventListener('resize', () => { sizeAlt(); drawAltitude(currentMin); });
sizeAlt();
drawAltitude(0);
requestAnimationFrame(altLoop);
</script>
</body>
</html>
